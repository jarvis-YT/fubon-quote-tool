name: fx
on:
  schedule:
    - cron: '35 1 * * 1-5'   # 09:35 Taipei
    - cron: '5 4 * * 1-5'    # 12:05 Taipei
    - cron: '35 8 * * 1-5'   # 16:35 Taipei
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python scripts/fetch_fx.py fx.json
      - run: |
          git config user.name jarvis-YT; git config user.email jarvis-YT@users.noreply.github.com
          git add fx.json; git diff --cached --quiet && exit 0
          git commit -qm "fx: $(python -c "import json;d=json.load(open('fx.json'));print(d['date'],d['time'],d['rates']['USD'])")"
          git pull -q --rebase origin main && git push -q origin HEAD:main
